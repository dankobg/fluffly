  pg:
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-pg}
      - POSTGRES_USER=${POSTGRES_USER:-test}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test}
      - POSTGRES_DB=${POSTGRES_DB:-test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    logging: *dev-logging
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-d",
          "${POSTGRES_DB:-test}",
          "-U",
          "${POSTGRES_USER:-test}",
        ]
  # ----------------------------------------------------------------------------
  rustfs:
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    networks:
      devproxy:
        aliases:
          - fluffly-rustfs
    environment:
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-true}
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      # - RUSTFS_SERVER_DOMAINS=${RUSTFS_SERVER_DOMAINS:-localhost,fluffly-dev.xyz}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-test}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-test}
    env_file:
      - .env
    logging: *dev-logging
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health",
        ]
  # ----------------------------------------------------------------------------
  # redis:
  #   environment:
  #     - REDIS_HOST=${REDIS_HOST:-redis}
  #     - REDIS_PORT=${REDIS_PORT:-6379}
  #     - REDIS_PASSWORD=${REDIS_PASSWORD:-}
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   logging: *dev-logging
  #   healthcheck:
  #     <<: *dev-healthcheck
  #     test: ["CMD", "redis-cli", "ping"]
  # ----------------------------------------------------------------------------
  kratos:
    env_file:
      - .env
    command: "serve --watch-courier --config /etc/config/kratos/kratos.yaml --dev"
    ports:
      - "${KRATOS_PUBLIC_PORT:-4433}:4433"
      - "${KRATOS_ADMIN_PORT:-4434}:4434"
    networks:
      devproxy:
        aliases:
          - fluffly-kratos
    logging: *dev-logging
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4433/health/alive",
        ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kratos.rule=Host(`fluffly-dev.xyz`) && PathPrefix(`/kratos`)
      - traefik.http.routers.kratos.tls=true
      - traefik.http.routers.kratos.service=kratos@docker
      - traefik.http.services.kratos.loadbalancer.server.port=4433
      - traefik.http.middlewares.kratos-stripprefix.stripprefix.prefixes=/kratos
      - traefik.http.middlewares.kratos-stripprefix.stripprefix.forceSlash=false
      - traefik.http.routers.kratos.middlewares=kratos-stripprefix@docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # ----------------------------------------------------------------------------
  kratos-migrate:
    env_file:
      - .env
    logging: *dev-logging
  # ----------------------------------------------------------------------------
  keto:
    env_file:
      - .env
    ports:
      - "${KETO_SERVE_READ_PORT:-4466}:4466"
      - "${KETO_SERVE_WRITE_PORT:-4467}:4467"
    networks:
      devproxy:
        aliases:
          - fluffly-keto
    logging: *dev-logging
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4466/health/alive",
        ]
  # ----------------------------------------------------------------------------
  keto-migrate:
    env_file:
      - .env
    logging: *dev-logging
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATA_FILE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - mailpit-data:/data
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_PORT:-1025}:1025"
    networks:
      intranet: {}
      devproxy:
        aliases:
          - fluffly-mailpit
    logging: *dev-logging
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8025/livez",
        ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mail.fluffly-dev.xyz`)
      - traefik.http.routers.mailpit.tls=true
      - traefik.http.routers.mailpit.service=mailpit@docker
      - traefik.http.services.mailpit.loadbalancer.server.port=8025
  # ----------------------------------------------------------------------------

volumes:
  mailpit-data:

networks:
  devproxy:
    external: true
